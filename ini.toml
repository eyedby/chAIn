[package]
name = "chain"
version = "0.1.0"
edition = "2021"

[dependencies]
# For the Solana anchor
solana-sdk = "2.0.0"
solana-client = "2.0.0"

# For the local "Pizza Counter" UI and sockets
tauri = { version = "2.0.0", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# For eBPF interaction
aya = "0.12"
aya-log = "0.2"
